<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Compare</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="diff.js"></script>
  <script defer src="merge.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <h1>Text Compare</h1>
      <div class="actions">
        <button id="swap" type="button">Swap sides</button>
        <button id="clear" type="button">Clear</button>
        <button id="start-merge" type="button">Merge drafts</button>
        <button id="exit-merge" type="button" hidden>Compare mode</button>
        <button id="compare" class="primary" type="button" title="Compare with Cmd or Ctrl + Enter">Compare</button>
        <button id="edit" class="primary" type="button" hidden>Edit texts</button>
      </div>
    </header>

    <section class="workspace" aria-label="Text comparison">
      <div class="options">
        <label id="case-option"><input type="checkbox" id="ignore-case"> Ignore case</label>
        <label id="space-option"><input type="checkbox" id="ignore-space"> Ignore whitespace</label>
        <label><input type="checkbox" id="only-changes" disabled> Show changes only</label>
      </div>

      <div id="editors" class="columns">
        <section class="editor">
          <div class="pane-heading"><label for="left">Original <small>LHS</small></label><button type="button" data-open="left">Open file</button></div>
          <textarea id="left" placeholder="Paste, type, or drop a text file…" spellcheck="false" autocapitalize="off"></textarea>
          <input type="file" id="left-file" hidden>
        </section>
        <section class="editor">
          <div class="pane-heading"><label for="right">Revised <small>RHS</small></label><button type="button" data-open="right">Open file</button></div>
          <textarea id="right" placeholder="Paste, type, or drop a text file…" spellcheck="false" autocapitalize="off"></textarea>
          <input type="file" id="right-file" hidden>
        </section>
      </div>

      <div id="results" hidden>
        <div class="columns result-headings">
          <div class="pane-heading">Original <small>LHS</small></div>
          <div class="pane-heading">Revised <small>RHS</small></div>
        </div>
        <div id="diff" tabindex="0" role="region" aria-label="Aligned diff rows"></div>
      </div>
      <footer>
        <span id="status" role="status">Paste two texts to compare.</span>
        <div id="navigation" class="actions" hidden>
          <button type="button" id="previous">Previous change</button>
          <span id="change-position" role="status"></span>
          <button type="button" id="next">Next change</button>
        </div>
      </footer>
      <section id="merge-panel" aria-labelledby="merge-title" hidden>
        <div class="merge-controls">
          <div class="actions">
            <button id="keep-left" type="button" aria-pressed="false">Keep left</button>
            <button id="keep-right" type="button" aria-pressed="false">Keep right</button>
          </div>
          <span id="merge-progress" role="status"></span>
        </div>
        <div class="pane-heading">
          <label id="merge-title" for="merged-text">Merged draft</label>
          <div class="actions">
            <button id="copy-merge" type="button">Copy</button>
            <button id="download-merge" type="button">Download text</button>
          </div>
        </div>
        <textarea id="merged-text" readonly spellcheck="false"></textarea>
        <p id="merge-message" role="status" hidden></p>
      </section>
    </section>
  </main>
</body>
</html>
